<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Mania — secure checkout</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #08080a; color: #f6f5f3;
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(520px, calc(100% - 40px)); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 44px); letter-spacing: -.04em; }
    p { margin: 0 0 20px; color: #a6a3a0; }
    a { color: #ff7a8f; }
  </style>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
  <main>
    <h1>Opening secure checkout…</h1>
    <p id="status">If this takes more than a few seconds, return to pricing and try again.</p>
    <a href="/pricing">Back to pricing</a>
  </main>
  <script>
    /*
     * Paste the Paddle sandbox client-side token below.
     * Paddle dashboard → My account → Settings → Authentication →
     * Client-side tokens → New token. Sandbox tokens start with "test_".
     *
     * For live checkout: use the live_ token and remove
     * Paddle.Environment.set("sandbox").
     */
    const PADDLE_CLIENT_TOKEN = "test_6d2d273f45f984207aecc7e508e";
    const status = document.getElementById("status");

    if (!PADDLE_CLIENT_TOKEN.startsWith("test_") && !PADDLE_CLIENT_TOKEN.startsWith("live_")) {
      status.textContent = "Checkout is not configured yet. Add the Paddle client-side token.";
    } else {
      if (PADDLE_CLIENT_TOKEN.startsWith("test_")) Paddle.Environment.set("sandbox");
      Paddle.Initialize({ token: PADDLE_CLIENT_TOKEN });
    }
  </script>
</body>
</html>
